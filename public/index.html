```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road Crack Detection</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #101418; color: #f3f4f6; }
    header { padding: 24px; background: #1b2229; border-bottom: 1px solid #343c45; }
    main { max-width: 850px; margin: 40px auto; padding: 20px; }
    .panel { padding: 28px; background: #1b2229; border: 1px solid #343c45; border-radius: 14px; }
    input, button { width: 100%; margin-top: 16px; padding: 13px; border-radius: 8px; }
    button { border: 0; background: #d1d5db; color: #111827; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    img { max-width: 100%; margin-top: 20px; border-radius: 8px; }
    .muted { color: #a8b0ba; }
    .result { padding: 12px; margin-top: 10px; background: #101418; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h2>Road Crack Detection</h2>
    <p class="muted">YOLO26s + STRIP | Visual explanations | VLM descriptions</p>
  </header>
  <main>
    <section class="panel">
      <h3>Analyze a road image</h3>
      <p class="muted">Select an image (maximum 4 MB) to preview it before analysis.</p>
      <input id="imageInput" type="file" accept="image/*">
      <img id="preview" alt="Selected road image preview" hidden>
      <button id="analyzeButton" disabled>Analyze Image</button>
      <p id="status" class="muted" aria-live="polite">Select an image to begin.</p>
      <div id="results"></div>
    </section>
  </main>
  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const button = document.getElementById("analyzeButton");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    input.addEventListener("change", () => {
      const file = input.files[0];
      results.replaceChildren();

      if (!file) {
        button.disabled = true;
        preview.hidden = true;
        status.textContent = "Select an image to begin.";
        return;
      }

      if (!file.type.startsWith("image/")) {
        status.textContent = "Please select an image file.";
        button.disabled = true;
        return;
      }

      if (file.size > 4 * 1024 * 1024) {
        status.textContent = "Image is larger than 4 MB. Please choose a smaller image.";
        button.disabled = true;
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.hidden = false;
      button.disabled = false;
      status.textContent = "Image ready for analysis.";
    });

    button.addEventListener("click", async () => {
      const file = input.files[0];
      if (!file) return;

      button.disabled = true;
      status.textContent = "Running model inference. This may take some time on the first request...";
      results.replaceChildren();

      try {
        const formData = new FormData();
        formData.append("file", file);

        const response = await fetch("https://road-crack-api.onrender.com/predict", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || `Request failed (${response.status})`);
        }

        status.textContent = `Analysis complete. ${data.count} detection(s) found.`;

        if (data.count === 0) {
          results.textContent = "No objects detected.";
        } else {
          data.detections.forEach((detection, index) => {
            const item = document.createElement("div");
            item.className = "result";

            const heading = document.createElement("strong");
            heading.textContent = `${index + 1}. ${detection.class_name}`;

            const detail = document.createElement("p");
            detail.textContent =
              `Confidence: ${(detection.confidence * 100).toFixed(2)}%`;

            const box = document.createElement("p");
            box.className = "muted";
            box.textContent = `Bounding box: ${detection.box_xyxy.join(", ")}`;

            item.append(heading, detail, box);
            results.appendChild(item);
          });
        }
      } catch (error) {
        status.textContent = `Analysis failed: ${error.message}`;
      } finally {
        button.disabled = !input.files[0];
      }
    });
  </script>
</body>
</html>
